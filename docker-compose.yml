services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abr_greens_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/abr_greens
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: abr_greens
      DB_POOL_MAX: 30
      JWT_SECRET: abr_greens_docker_production_secret_2026
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: abr_greens_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: abr_greens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abr_greens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
