services:
  nginx:
    image: nginx:alpine
    container_name: abr_greens_nginx
    restart: always
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage:/app/storage:ro
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abr_greens_api
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
